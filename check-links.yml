name: Check links every 24 hours
on:
  schedule:
    - cron: "0 0 * * *" # Setiap hari 00:00 UTC (07:00 WIB)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: link-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kebutuhan
        run: pip install -r requirements.txt
      - name: Periksa semua link dan kirim Telegram jika perlu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Simpan laporan terbaru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          git diff --cached --quiet || git commit -m "Update link monitoring report"
          git push
